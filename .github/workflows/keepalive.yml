name: Keep Supabase awake

# Supabase's free plan pauses a project after 7 days with no activity.
# This pings the database every 3 days so Plate Log never pauses.
on:
  schedule:
    - cron: "17 14 */3 * *"   # every 3 days (times are UTC)
    - cron: "41 15 1 * *"     # 1st of each month: also records a tiny commit
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://dawpwxxccjnzfjscpkcl.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_Z1R8jB_n6AWrqwqIPwxhTg_VkLDZuCm" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo ""
          echo "Supabase answered, project is awake."

      # GitHub switches off scheduled jobs in repos with no commits for 60 days.
      # Once a month, record the last ping date so the repo always counts as active.
      - name: Record monthly heartbeat
        if: github.event.schedule == '41 15 1 * *'
        uses: actions/checkout@v4
      - name: Commit heartbeat
        if: github.event.schedule == '41 15 1 * *'
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > .github/last-ping.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .github/last-ping.txt
          git commit -m "Keep-alive heartbeat" || echo "Nothing to commit"
          git push
